name: Build and release APK

on:
  # 推送 release tag（v*）时触发编译，并把 APK 附加到对应 GitHub Release
  push:
    tags:
      - 'v*'
  # 支持手动触发（产物仅存于 Actions 工件，不创建 Release）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 由 tag 计算版本号
        # v1.2.3 → VERSION_NAME=1.2.3, VERSION_CODE=10203
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: 解码 release keystore（来自仓库 secret）
        if: ${{ secrets.RELEASE_KEYSTORE_FILE != '' }}
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
        run: |
          echo "$RELEASE_KEYSTORE_FILE" | base64 -d > "$GITHUB_WORKSPACE/release-keystore.jks"
          ls -l "$GITHUB_WORKSPACE/release-keystore.jks"

      - name: Gradle 编译 release APK（正式签名）
        # secret 齐全时用 release keystore 签名；
        # 缺 secret 时 build.gradle.kts 自动回退 debug 签名，流水线仍可跑通
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          SIGNING_ARGS=()
          if [ -n "$RELEASE_KEYSTORE_FILE" ]; then
            echo "构建正式签名 release APK"
            SIGNING_ARGS=(
              "-PRELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release-keystore.jks"
              "-PRELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
              "-PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              "-PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            )
          else
            echo "::warning::未设置 RELEASE_KEYSTORE_FILE secret，release 回退 debug 签名"
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            "-PVERSION_NAME=$VERSION_NAME" \
            "-PVERSION_CODE=$VERSION_CODE" \
            "${SIGNING_ARGS[@]}"

      - name: 统一产物文件名
        run: cp app/build/outputs/apk/release/app-release.apk uc-daily.apk

      - name: 上传到 Actions 工件
        uses: actions/upload-artifact@v4
        with:
          name: uc-daily-apk
          path: uc-daily.apk
          if-no-files-found: error

      # 仅 tag 触发时创建/更新 GitHub Release（README 下载链接指向 releases/latest）
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: uc-daily.apk
          generate_release_notes: true
