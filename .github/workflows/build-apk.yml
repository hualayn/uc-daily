name: Build APK

on:
  # 推送 release tag（v*）时触发编译，并把 APK 附加到对应 GitHub Release
  push:
    tags:
      - 'v*'
  # 支持手动触发（产物仅存于 Actions 工件，不创建 Release）
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: Gradle 编译 debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 统一产物文件名
        run: cp app/build/outputs/apk/debug/app-debug.apk uc-daily.apk

      - name: 上传到 Actions 工件
        uses: actions/upload-artifact@v4
        with:
          name: uc-daily-apk
          path: uc-daily.apk
          if-no-files-found: error

      # 仅 tag 触发时创建/更新 GitHub Release（README 下载链接指向 releases/latest）
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: uc-daily.apk
          generate_release_notes: true
