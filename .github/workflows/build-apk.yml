name: Build and release APK

on:
  # 推送 release tag（v*）时触发编译，并把 APK 附加到对应 GitHub Release
  push:
    tags:
      - 'v*'
  # 支持手动触发（产物仅存于 Actions 工件，不创建 Release）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 由 tag 计算版本号
        # v1.2.3 → VERSION_NAME=1.2.3, VERSION_CODE=10203
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: 解码 release keystore（来自仓库 secret）
        # 注意：secrets 上下文不能用在 if 条件里，改为在脚本内判空
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_FILE" ]; then
            echo "::error::未设置 RELEASE_KEYSTORE_FILE secret（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_FILE" | base64 -d > "$GITHUB_WORKSPACE/release-keystore.jks"
          ls -l "$GITHUB_WORKSPACE/release-keystore.jks"

      - name: Gradle 编译 release APK（正式签名）
        # 四个签名 secret 缺一不可：发布包必须是 release 签名，
        # 回退 debug 签名会破坏升级链（与已安装 release 包签名冲突），故直接失败
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in RELEASE_KEYSTORE_FILE RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v 未设置或为空，请在 Settings → Secrets and variables → Actions 配置后重推 tag"
              exit 1
            fi
          done
          echo "构建正式签名 release APK"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            "-PRELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release-keystore.jks" \
            "-PRELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" \
            "-PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" \
            "-PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" \
            "-PVERSION_NAME=$VERSION_NAME" \
            "-PVERSION_CODE=$VERSION_CODE"

      - name: 统一产物文件名
        run: cp app/build/outputs/apk/release/app-release.apk uc-daily.apk

      - name: 上传到 Actions 工件
        uses: actions/upload-artifact@v4
        with:
          name: uc-daily-apk
          path: uc-daily.apk
          if-no-files-found: error

      # 仅 tag 触发时创建/更新 GitHub Release（README 下载链接指向 releases/latest）
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: uc-daily.apk
          generate_release_notes: true
